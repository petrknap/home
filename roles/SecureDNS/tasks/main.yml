- name: Setup DNS
  become: yes
  lineinfile:
    path: /etc/systemd/resolved.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    insertafter: '^\[Resolve\]'
  loop:
  - { regexp: '^#?DNS=', line: 'DNS=1.1.1.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com' }
  - { regexp: '^#?FallbackDNS=', line: 'FallbackDNS=8.8.8.8#dns.google 2001:4860:4860::8888#dns.google' }
  - { regexp: '^#?DNSOverTLS=', line: 'DNSOverTLS=yes' }
  - { regexp: '^#?Domains=', line: 'Domains=~.' }

- name: Restart systemd-resolved
  become: yes
  systemd:
    name: systemd-resolved
    state: restarted
    enabled: true
