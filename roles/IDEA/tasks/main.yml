- name: Set required version and build
  set_fact:
    IDEA:
      version: 2025.2.6.2
      build: 252.28539.54

- name: Prepare directory
  file:
    path: "{{ home_dir }}/.apps/IDEA"
    state: directory

- name: Download and install
  unarchive:
    src: "https://download.jetbrains.com/idea/ideaIC-{{ IDEA.version }}.tar.gz"
    dest: "{{ home_dir }}/.apps/IDEA"
    creates: "{{ home_dir }}/.apps/IDEA/idea-IC-{{ IDEA.build }}"
    remote_src: yes

- name: Create desktop shortcut
  template:
    src: templates/IDEA.desktop
    dest: "{{ home_dir }}/Desktop/IDEA.desktop"
    mode: 0774

- name: Set inotify watches limit # https://youtrack.jetbrains.com/articles/SUPPORT-A-1715/Inotify-Watches-Limit-Linux
  become: yes
  sysctl:
    name: fs.inotify.max_user_watches
    value: 1048576
    state: present
